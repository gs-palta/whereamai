<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OAuth Callback · Where Am aI</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head>
<body style="font-family: monospace; padding: 40px; background: #111; color: #eee;">
  <h2>Authorization Code</h2>
  <p id="status">Reading params...</p>
  <pre id="out" style="background: #222; padding: 20px; font-size: 16px; word-break: break-all;"></pre>
  <script>
    const p = new URLSearchParams(window.location.search);
    const code = p.get('code');
    const state = p.get('state');
    const error = p.get('error');
    const errDesc = p.get('error_description');
    if (code) {
      document.getElementById('status').innerText = 'Copy this code:';
      document.getElementById('out').innerText = code;
    } else if (error) {
      document.getElementById('status').innerText = 'OAuth Error:';
      document.getElementById('out').innerText = error + (errDesc ? ': ' + errDesc : '');
    } else {
      document.getElementById('status').innerText = 'No code found in URL params.';
    }
  </script>
</body>
</html>
